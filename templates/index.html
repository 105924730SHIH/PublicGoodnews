<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>每日資訊整理 · Telegram 推播</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2481cc" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="資訊推播" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="/icons/favicon.png" />

<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="install-banner" class="install-banner hidden">
  <span>📲 將此工具加到主畫面，隨時一鍵推播</span>
  <div class="install-banner-actions">
    <button id="install-btn">安裝</button>
    <button id="install-dismiss" aria-label="關閉">✕</button>
  </div>
</div>

<div class="app-container">

  <header id="title-block">
    <h1>📢 每日資訊整理機器人</h1>
    <p>公開資訊觀測站重大訊息 × 工商日報理財新訊 → 一鍵整理並推播至 Telegram</p>
  </header>

  <main class="grid">

    <section class="card">
      <h2>🔑 Telegram 設定</h2>

      <label for="token-input">Bot Token</label>
      <input id="token-input" type="password" placeholder="例如：123456789:AAExxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />

      <label for="chatid-input">Chat ID</label>
      <input id="chatid-input" type="text" placeholder="例如：8722940849（可為個人或群組 ID）" autocomplete="off" />

      <p class="hint">⚠️ 您的 Token 僅用於本次發送請求，不會被儲存於伺服器。</p>

      <div class="button-row">
        <button id="fetch-btn" class="btn btn-secondary">🔍 抓取最新資料</button>
        <button id="send-btn" class="btn btn-primary">🚀 發送到 Telegram</button>
      </div>

      <label for="status-box">狀態訊息</label>
      <textarea id="status-box" rows="5" readonly placeholder="尚無狀態訊息"></textarea>
    </section>

    <section class="card">
      <h2>📱 訊息預覽</h2>
      <div class="tg-preview-card">
        <div class="tg-preview-header">📱 Telegram 訊息預覽</div>
        <div id="preview-body" class="tg-preview-body">尚未抓取資料，請點擊左側「抓取最新資料」。</div>
      </div>
    </section>

  </main>

  <footer>
    資料僅供參考，請以官方公告為準。
  </footer>

</div>

<script src="/static/app.js"></script>
</body>
</html>
